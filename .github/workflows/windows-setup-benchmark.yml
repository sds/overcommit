name: Windows setup experiments
on:
  push:
    branches: [perf/windows-setup-experiments]
  workflow_dispatch:
jobs:
  setup:
    name: setup ${{ matrix.mode }} (${{ matrix.ruby }})
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [control, pinned, cached]
        ruby: ['3.3', '3.4', '4.0']
    env:
      BUNDLE_WITHOUT: lint
      SPEC_WORKERS: 4
      SPEC_SHARD: 3/5
    steps:
      - uses: actions/checkout@v4
      - name: Copy diagnostic dependency lock
        if: matrix.mode == 'pinned'
        shell: pwsh
        run: Copy-Item .github/benchmarks/dependencies.lock Gemfile.lock
      - uses: actions/cache@v4
        if: matrix.mode == 'cached'
        with:
          path: Gemfile.lock
          key: windows-lock-benchmark-${{ matrix.ruby }}-${{ hashFiles('Gemfile', '*.gemspec') }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          windows-toolchain: none
      - name: Verify actual shard
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (git --exec-path) -Parent) -Parent
          $env:PATH = (Join-Path $gitRoot 'bin') + ';' + $env:PATH
          git config --global user.email 'gh-actions@example.com'
          git config --global user.name 'GitHub Actions'
          bundle exec ruby script/parallel_rspec.rb
  ramdisk:
    name: RAM disk (shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      BUNDLE_WITHOUT: lint
      CI: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          windows-toolchain: none
      - name: Install and mount diagnostic RAM disk
        shell: pwsh
        run: |
          $started = [System.Diagnostics.Stopwatch]::StartNew()
          $target = Join-Path $env:RUNNER_TEMP 'imdisk'
          New-Item -ItemType Directory $target | Out-Null
          Invoke-WebRequest 'https://static.ltr-data.se/files/imdisk.zip' -OutFile "$target/package.zip"
          Expand-Archive "$target/package.zip" "$target/files"
          $inf = "$target/files/imdisk.inf"
          & rundll32.exe setupapi.dll,InstallHinfSection DefaultInstall 132 $inf
          if ($LASTEXITCODE -ne 0) { throw "ImDisk install failed: $LASTEXITCODE" }
          & "$target/files/cli/amd64/imdisk.exe" -a -t vm -s 1024M -m R: -p '/fs:ntfs /q /y'
          if ($LASTEXITCODE -ne 0) { throw "RAM disk mount failed: $LASTEXITCODE" }
          New-Item -ItemType Directory 'R:\t' | Out-Null
          $started.Stop()
          Write-Output ('RAMDISK_SETUP_SECONDS ' + $started.Elapsed.TotalSeconds)
      - name: Prepare Git and compare
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (git --exec-path) -Parent) -Parent
          $env:PATH = (Join-Path $gitRoot 'bin') + ';' + $env:PATH
          git config --global user.email 'gh-actions@example.com'
          git config --global user.name 'GitHub Actions'
          .github/benchmarks/run.ps1 -Variant ramdisk -Shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramdisk-${{ matrix.shard }}
          path: benchmark-results
          retention-days: 3
