name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rspec:
    name: rspec (${{ matrix.ruby-version }}, ${{ matrix.os }})
    timeout-minutes: ${{ matrix.os == 'windows' && 30 || 15 }}
    runs-on: ${{ matrix.runner || format('{0}-latest', matrix.os) }}
    env:
      BUNDLE_WITHOUT: lint
      SPEC_WORKERS: ${{ matrix.os == 'windows' && 4 || 8 }}

    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.3"
          - "3.4"
          - "4.0"
        os:
          - ubuntu
          - windows
        include:
          - os: ubuntu
            runner: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          # Test dependencies are pure Ruby; no native build tools are needed.
          windows-toolchain: none

      - name: Use Git directly on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Bypass Git for Windows' bin/git.exe launcher for thousands of calls.
          $gitRoot = Split-Path (Split-Path (git --exec-path) -Parent) -Parent
          Join-Path $gitRoot 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run tests
        run: |
          git config --global user.email "gh-actions@example.com"
          git config --global user.name "GitHub Actions"
          bundle exec ruby script/parallel_rspec.rb

      - name: Code coverage reporting
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          flag-name: ruby${{ matrix.ruby-version }}-${{ matrix.os }}
          parallel: true

  finish:
    needs: rspec
    runs-on: ubuntu-26.04

    steps:
      - name: Finalize code coverage report
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true
