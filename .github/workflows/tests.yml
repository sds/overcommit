name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rspec:
    name: rspec (${{ matrix.ruby-version }}, ${{ matrix.os }})
    timeout-minutes: 15
    runs-on: ${{ matrix.runner || format('{0}-latest', matrix.os) }}

    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "2.6"
          - "2.7"
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
        os:
          - ubuntu
          # At the moment of this commit various specs fail on Windows.
          # Any contributor is welcome to fix them and enable the Windows build.
          # Please see Issue #836 for more details.
          # - windows
        include:
          - os: ubuntu
            runner: ubuntu-26.04
          # setup-ruby has no builds of these Rubies for ubuntu-26.04
          - { ruby-version: "2.6", os: ubuntu, runner: ubuntu-24.04 }
          - { ruby-version: "2.7", os: ubuntu, runner: ubuntu-24.04 }
          - { ruby-version: "3.0", os: ubuntu, runner: ubuntu-24.04 }
          - { ruby-version: "3.1", os: ubuntu, runner: ubuntu-24.04 }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: |
          git config --global user.email "gh-actions@example.com"
          git config --global user.name "GitHub Actions"
          bundle exec rspec

      - name: Code coverage reporting
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          flag-name: ruby${{ matrix.ruby-version }}-${{ matrix.os }}
          parallel: true

  finish:
    needs: rspec
    runs-on: ubuntu-26.04

    steps:
      - name: Finalize code coverage report
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          parallel-finished: true
