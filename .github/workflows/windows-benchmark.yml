name: Windows remaining experiments C
on:
  push:
    branches: [perf/windows-experiments-c]
jobs:
  paired:
    name: ${{ matrix.variant }} (${{ matrix.ruby }}, shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CI: true
      BUNDLE_WITHOUT: lint
      BUNDLE_PATH: vendor/bundle
    strategy:
      fail-fast: false
      matrix:
        variant: [weighted, native_query, workers6, workers8]
        ruby: ['3.3', '4.0']
        shard: [1, 2, 3, 4, 5]
        exclude:
          - { variant: weighted, ruby: '3.3' }
          - { variant: native_query, ruby: '4.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          windows-toolchain: none
      - name: Prepare Git
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (git --exec-path) -Parent) -Parent
          Join-Path $gitRoot 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          git config --global user.email 'gh-actions@example.com'
          git config --global user.name 'GitHub Actions'
      - name: Paired benchmark
        shell: pwsh
        run: .github/benchmarks/run.ps1 -Variant '${{ matrix.variant }}' -Shard ${{ matrix.shard }}
      - name: Retain measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-${{ matrix.ruby }}-${{ matrix.shard }}
          path: benchmark-results
          retention-days: 3
