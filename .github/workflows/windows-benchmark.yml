name: Windows performance experiments
on:
  push:
    branches: [perf/windows-experiments]
jobs:
  paired:
    name: ${{ matrix.variant }} (shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CI: true
      BUNDLE_WITHOUT: lint
    strategy:
      fail-fast: false
      matrix:
        variant: [empty_template, fixture_install, parent_fixture, timestamp, fsync, short_temp, lean_path, workers6, workers8]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          windows-toolchain: none
      - name: Prepare Git
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (git --exec-path) -Parent) -Parent
          Join-Path $gitRoot 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          git config --global user.email 'gh-actions@example.com'
          git config --global user.name 'GitHub Actions'
      - name: Paired benchmark
        shell: pwsh
        run: .github/benchmarks/run.ps1 -Variant '${{ matrix.variant }}' -Shard ${{ matrix.shard }}
      - name: Retain measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-${{ matrix.shard }}
          path: benchmark-results
          retention-days: 3
